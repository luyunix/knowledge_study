<svg xmlns="http://www.w3.org/2000/svg" width="640" height="204" viewBox="0 0 640 204"><title>最大连续子数组的状态不变量</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#444"/></marker></defs><rect width="640" height="204" fill="white"/><path d="M309 47 H326" fill="none" stroke="#444" stroke-width="1" marker-end="url(#a)"/><path d="M309 139 H326" fill="none" stroke="#444" stroke-width="1" marker-end="url(#a)"/><rect x="20" y="18" width="289" height="58" fill="white" stroke="#444" stroke-width="1"/><text x="164.5" y="53" font-family="PingFang SC,sans-serif" font-size="18" text-anchor="middle" fill="black"><tspan x="164.5" dy="0">以 i 结尾：ending</tspan></text><rect x="331" y="18" width="289" height="58" fill="white" stroke="#444" stroke-width="1"/><text x="475.5" y="53" font-family="PingFang SC,sans-serif" font-size="18" text-anchor="middle" fill="black"><tspan x="475.5" dy="0">前缀最优：best</tspan></text><rect x="20" y="110" width="289" height="58" fill="white" stroke="#444" stroke-width="1"/><text x="164.5" y="145" font-family="PingFang SC,sans-serif" font-size="18" text-anchor="middle" fill="black"><tspan x="164.5" dy="0">4 → -1 → 2 → 1</tspan></text><rect x="331" y="110" width="289" height="58" fill="white" stroke="#444" stroke-width="1"/><text x="475.5" y="145" font-family="PingFang SC,sans-serif" font-size="18" text-anchor="middle" fill="black"><tspan x="475.5" dy="0">最大和：6</tspan></text></svg>
