<svg xmlns="http://www.w3.org/2000/svg" width="640" height="940" viewBox="0 0 640 940" role="img" aria-labelledby="title desc"><title id="title">11 一个整数怎样变成两个字节</title><desc id="desc">300 编码为十六进制 AC 02；每字节低七位是数据，高位一表示继续，高位零表示结束。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="940" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">11 一个整数怎样变成两个字节</text><rect x="24" y="80" width="592" height="157" rx="9" fill="#e2eefb"/><text x="42" y="117" font-size="25" fill="#172c43" font-weight="600">300 = 44 + 2 × 128</text><text x="42" y="159" font-size="23" fill="#172c43" font-weight="400">低 7 位是 44：0101100</text><text x="42" y="193" font-size="23" fill="#172c43" font-weight="400">余下部分是 2：0000010</text><path d="M 320 247 L 320 284" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="295" width="592" height="156" rx="9" fill="#fff0db"/><text x="42" y="332" font-size="25" fill="#172c43" font-weight="600">先写低位组，再写高位组</text><text x="42" y="374" font-size="23" fill="#172c43" font-weight="400">第 1 字节：1 | 0101100 = AC</text><text x="42" y="408" font-size="23" fill="#172c43" font-weight="400">第 2 字节：0 | 0000010 = 02</text><rect x="24" y="488" width="592" height="155" rx="9" fill="#eef3f7"/><text x="42" y="525" font-size="25" fill="#172c43" font-weight="600">最高位不是数值的一部分</text><text x="42" y="567" font-size="23" fill="#172c43" font-weight="400">1：后面还有字节，继续读。</text><text x="42" y="601" font-size="23" fill="#172c43" font-weight="400">0：当前整数结束。</text><rect x="24" y="680" width="592" height="188" rx="9" fill="#dcf2e6"/><text x="42" y="717" font-size="25" fill="#172c43" font-weight="600">解码：剥掉最高位，再移位累加</text><text x="42" y="759" font-size="23" fill="#172c43" font-weight="400">AC &amp; 7F = 44</text><text x="42" y="793" font-size="23" fill="#172c43" font-weight="400">02 &amp; 7F = 2；2 左移 7 位 = 256</text><text x="42" y="827" font-size="23" fill="#172c43" font-weight="400">44 + 256 = 300</text><text x="24" y="909" font-size="23" fill="#425a70" font-weight="400">这里采用 Lucene VInt 的延续位约定。</text></g></svg>
