<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-labelledby="title desc"><title id="title">08 词典也需要“目录”</title><desc id="desc">car 和 cat 共享 c、a 两层路径。词典索引用前缀信息帮助定位包含目标词的词典块。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="800" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">08 词典也需要“目录”</text><text x="24" y="83" font-size="23" fill="#425a70" font-weight="400">用 car、cat、dog 展示共享前缀。</text><path d="M 92 239 L 170 166" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 92 254 L 170 362" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 238 156 L 305 156" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 238 362 L 305 362" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 373 147 L 443 127" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 373 167 L 443 239" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 373 362 L 443 362" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="214" width="68" height="52" rx="9" fill="#eef3f7"/><text x="41" y="249" font-size="25" fill="#172c43" font-weight="400">根</text><rect x="170" y="130" width="68" height="52" rx="9" fill="#e2eefb"/><text x="187" y="165" font-size="25" fill="#172c43" font-weight="400">c</text><rect x="305" y="130" width="68" height="52" rx="9" fill="#e2eefb"/><text x="322" y="165" font-size="25" fill="#172c43" font-weight="400">a</text><rect x="443" y="101" width="68" height="52" rx="9" fill="#eef3f7"/><text x="460" y="136" font-size="25" fill="#172c43" font-weight="400">r</text><rect x="443" y="213" width="68" height="52" rx="9" fill="#dcf2e6"/><text x="460" y="248" font-size="25" fill="#172c43" font-weight="400">t</text><rect x="170" y="336" width="68" height="52" rx="9" fill="#eef3f7"/><text x="187" y="371" font-size="25" fill="#172c43" font-weight="400">d</text><rect x="305" y="336" width="68" height="52" rx="9" fill="#eef3f7"/><text x="322" y="371" font-size="25" fill="#172c43" font-weight="400">o</text><rect x="443" y="336" width="68" height="52" rx="9" fill="#eef3f7"/><text x="460" y="371" font-size="25" fill="#172c43" font-weight="400">g</text><text x="526" y="138" font-size="22" fill="#172c43" font-weight="400">car</text><text x="526" y="250" font-size="22" fill="#172c43" font-weight="400">cat</text><text x="526" y="373" font-size="22" fill="#172c43" font-weight="400">dog</text><rect x="24" y="431" width="592" height="154" rx="9" fill="#dcf2e6"/><text x="42" y="468" font-size="25" fill="#172c43" font-weight="600">查 cat：根 → c → a → t</text><text x="42" y="510" font-size="23" fill="#172c43" font-weight="400">若不存在对应分支，就可以停止。</text><text x="42" y="544" font-size="23" fill="#172c43" font-weight="400">路径节点表示词的字节或字符，不是文档。</text><rect x="24" y="617" width="592" height="155" rx="9" fill="#eef3f7"/><text x="42" y="654" font-size="25" fill="#172c43" font-weight="600">接到词典块，再接到倒排数据</text><text x="42" y="696" font-size="23" fill="#172c43" font-weight="400">这张图只解释前缀查找。</text><text x="42" y="730" font-size="23" fill="#172c43" font-weight="400">不是某个 Lucene 版本的实际文件布局。</text></g></svg>
