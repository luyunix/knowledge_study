<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title desc"><title id="title">04 一个词后面，究竟存了什么</title><desc id="desc">词典通过元信息定位 docID、词频和位置数据。词频决定给每篇文档读多少个位置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="850" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">04 一个词后面，究竟存了什么</text><rect x="24" y="80" width="592" height="154" rx="9" fill="#e2eefb"/><text x="42" y="117" font-size="25" fill="#172c43" font-weight="600">词典中的一个条目</text><text x="42" y="159" font-size="23" fill="#172c43" font-weight="400">字段：content；词：超时</text><text x="42" y="193" font-size="23" fill="#172c43" font-weight="400">df = 2；总出现次数 = 3</text><path d="M 320 244 L 320 285" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="64" y="326" font-size="24" fill="#172c43" font-weight="600">该词的元信息定位下面这些数据</text><text x="24" y="390" font-size="24" fill="#172c43" font-weight="400">docID 流</text><rect x="234" y="357" width="120" height="48" rx="9" fill="#eef3f7"/><text x="250" y="390" font-size="25" fill="#172c43" font-weight="400">0</text><rect x="362" y="357" width="120" height="48" rx="9" fill="#eef3f7"/><text x="378" y="390" font-size="25" fill="#172c43" font-weight="400">2</text><text x="24" y="461" font-size="24" fill="#172c43" font-weight="400">词频流</text><rect x="234" y="428" width="120" height="48" rx="9" fill="#eef3f7"/><text x="250" y="461" font-size="25" fill="#172c43" font-weight="400">1</text><rect x="362" y="428" width="120" height="48" rx="9" fill="#eef3f7"/><text x="378" y="461" font-size="25" fill="#172c43" font-weight="400">2</text><text x="24" y="532" font-size="24" fill="#172c43" font-weight="400">位置流</text><rect x="234" y="499" width="78" height="48" rx="9" fill="#eef3f7"/><text x="250" y="532" font-size="25" fill="#172c43" font-weight="400">3</text><rect x="320" y="499" width="78" height="48" rx="9" fill="#eef3f7"/><text x="336" y="532" font-size="25" fill="#172c43" font-weight="400">3</text><rect x="406" y="499" width="78" height="48" rx="9" fill="#eef3f7"/><text x="422" y="532" font-size="25" fill="#172c43" font-weight="400">4</text><text x="24" y="580" font-size="22" fill="#425a70" font-weight="400">先取 1 个位置给 docID 0，再取 2 个给 docID 2。</text><rect x="24" y="620" width="592" height="155" rx="9" fill="#dcf2e6"/><text x="42" y="657" font-size="25" fill="#172c43" font-weight="600">解码后看到的逻辑记录</text><text x="42" y="699" font-size="23" fill="#172c43" font-weight="400">docID 0 | tf 1 | positions [3]</text><text x="42" y="733" font-size="23" fill="#172c43" font-weight="400">docID 2 | tf 2 | positions [3, 4]</text><text x="24" y="818" font-size="23" fill="#425a70" font-weight="400">分流示意，不是 Lucene 文件的逐字节布局。</text></g></svg>
