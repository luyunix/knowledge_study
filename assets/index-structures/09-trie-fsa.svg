<svg xmlns="http://www.w3.org/2000/svg" width="640" height="995" viewBox="0 0 640 995" role="img" aria-labelledby="title desc"><title id="title">09 从共享前缀到共享等价状态</title><desc id="desc">四个词的 trie 有九个状态。相同的剩余语言允许合并状态，得到四状态自动机；这是集合识别，不是带值映射。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="995" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">09 从共享前缀到共享等价状态</text><text x="24" y="84" font-size="23" fill="#425a70" font-weight="400">词集合：bar、bat、car、cat</text><text x="24" y="125" font-size="24" fill="#172c43" font-weight="600">Trie：相同后续路径，仍各存一份</text><path d="M 92 246 L 176 184" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 92 260 L 176 342" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 244 184 L 318 184" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 244 342 L 318 342" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 386 175 L 478 157" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 386 193 L 478 237" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 386 333 L 478 317" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 386 351 L 478 397" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="226" width="68" height="52" rx="9" fill="#eef3f7"/><text x="41" y="261" font-size="25" fill="#172c43" font-weight="400">根</text><rect x="176" y="158" width="68" height="52" rx="9" fill="#eef3f7"/><text x="193" y="193" font-size="25" fill="#172c43" font-weight="400">b</text><rect x="176" y="316" width="68" height="52" rx="9" fill="#eef3f7"/><text x="193" y="351" font-size="25" fill="#172c43" font-weight="400">c</text><rect x="318" y="158" width="68" height="52" rx="9" fill="#e2eefb"/><text x="335" y="193" font-size="25" fill="#172c43" font-weight="400">a</text><rect x="318" y="316" width="68" height="52" rx="9" fill="#e2eefb"/><text x="335" y="351" font-size="25" fill="#172c43" font-weight="400">a</text><rect x="478" y="131" width="68" height="52" rx="9" fill="#dcf2e6"/><text x="495" y="166" font-size="25" fill="#172c43" font-weight="400">r</text><rect x="478" y="211" width="68" height="52" rx="9" fill="#dcf2e6"/><text x="495" y="246" font-size="25" fill="#172c43" font-weight="400">t</text><rect x="478" y="291" width="68" height="52" rx="9" fill="#dcf2e6"/><text x="495" y="326" font-size="25" fill="#172c43" font-weight="400">r</text><rect x="478" y="371" width="68" height="52" rx="9" fill="#dcf2e6"/><text x="495" y="406" font-size="25" fill="#172c43" font-weight="400">t</text><text x="24" y="477" font-size="23" fill="#172c43" font-weight="600">合并后：等价的后续结构共同指向同一状态</text><rect x="24" y="547" width="68" height="52" rx="9" fill="#eef3f7"/><text x="41" y="582" font-size="25" fill="#172c43" font-weight="400">S0</text><rect x="252" y="547" width="68" height="52" rx="9" fill="#e2eefb"/><text x="269" y="582" font-size="25" fill="#172c43" font-weight="400">S1</text><rect x="490" y="547" width="68" height="52" rx="9" fill="#e2eefb"/><text x="507" y="582" font-size="25" fill="#172c43" font-weight="400">S2</text><rect x="490" y="726" width="68" height="52" rx="9" fill="#dcf2e6"/><text x="507" y="761" font-size="25" fill="#172c43" font-weight="400">S3</text><path d="M 92 573 L 250 573" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="118" y="550" font-size="23" fill="#172c43" font-weight="400">b 或 c</text><path d="M 320 573 L 488 573" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="390" y="550" font-size="23" fill="#172c43" font-weight="400">a</text><path d="M 524 607 L 524 724" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="393" y="676" font-size="23" fill="#172c43" font-weight="400">r 或 t</text><rect x="24" y="811" width="592" height="155" rx="9" fill="#dcf2e6"/><text x="42" y="848" font-size="25" fill="#172c43" font-weight="600">只回答“这个词在不在集合中”</text><text x="42" y="890" font-size="23" fill="#172c43" font-weight="400">Trie：9 个状态；合并后：4 个状态。</text><text x="42" y="924" font-size="23" fill="#172c43" font-weight="400">S3 是接受态；走到 S1 / S2 还不算命中。</text></g></svg>
