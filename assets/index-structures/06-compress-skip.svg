<svg xmlns="http://www.w3.org/2000/svg" width="640" height="995" viewBox="0 0 640 995" role="img" aria-labelledby="title desc"><title id="title">06 少存一些，少解码一些</title><desc id="desc">差值需配合紧凑编码才节省空间；块最大值和定位信息可跳过不可能命中的块。此处不是四条文档的数据。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="995" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">06 少存一些，少解码一些</text><rect x="24" y="80" width="592" height="154" rx="9" fill="#e2eefb"/><text x="42" y="117" font-size="25" fill="#172c43" font-weight="600">有序 docID 可以换成差值</text><text x="42" y="159" font-size="23" fill="#172c43" font-weight="400">原编号： [3, 10, 11, 20]</text><text x="42" y="193" font-size="23" fill="#172c43" font-weight="400">差值：   [3,  7,  1,  9]</text><text x="24" y="275" font-size="23" fill="#425a70" font-weight="400">下面用另一条长列表，演示按块跳过：</text><rect x="24" y="300" width="592" height="130" rx="9" fill="#eef3f7"/><text x="42" y="337" font-size="25" fill="#172c43" font-weight="600">[2, 4, 7]</text><text x="42" y="379" font-size="23" fill="#172c43" font-weight="400">最大值 7 &lt; 20：跳过</text><rect x="24" y="450" width="592" height="130" rx="9" fill="#eef3f7"/><text x="42" y="487" font-size="25" fill="#172c43" font-weight="600">[12, 15, 18]</text><text x="42" y="529" font-size="23" fill="#172c43" font-weight="400">最大值 18 &lt; 20：跳过</text><rect x="24" y="600" width="592" height="130" rx="9" fill="#dcf2e6"/><text x="42" y="637" font-size="25" fill="#172c43" font-weight="600">[25, 29, 31]</text><text x="42" y="679" font-size="23" fill="#172c43" font-weight="400">最大值 31 ≥ 20：解码</text><rect x="24" y="770" width="592" height="155" rx="9" fill="#fff0db"/><text x="42" y="807" font-size="25" fill="#172c43" font-weight="600">advance(20) 的结果是 25</text><text x="42" y="849" font-size="23" fill="#172c43" font-weight="400">它寻找的是“第一个 ≥ 20”的 docID。</text><text x="42" y="883" font-size="23" fill="#172c43" font-weight="400">不是要求列表里一定存在 20。</text><text x="24" y="965" font-size="23" fill="#425a70" font-weight="400">块大小、元信息和编码方式由具体格式决定。</text></g></svg>
