<svg xmlns="http://www.w3.org/2000/svg" width="640" height="906" viewBox="0 0 640 906" role="img" aria-labelledby="title desc"><title id="title">03 倒排不是复制一遍正文</title><desc id="desc">将三个词出现记录分组为两个文档记录。D3 的重复词变成词频 2，而不是两个重复 docID。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="906" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">03 倒排不是复制一遍正文</text><rect x="24" y="80" width="592" height="160" rx="9" fill="#eef3f7"/><text x="42" y="117" font-size="25" fill="#172c43" font-weight="600">把“超时”的出现记录挑出来</text><text x="42" y="159" font-size="23" fill="#172c43" font-weight="400">D1 第 3 个词 → (超时, 0, 3)</text><text x="42" y="193" font-size="23" fill="#172c43" font-weight="400">D3 → (超时, 2, 3)、(超时, 2, 4)</text><path d="M 320 250 L 320 283" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="294" width="592" height="187" rx="9" fill="#e2eefb"/><text x="42" y="331" font-size="25" fill="#172c43" font-weight="600">按词、docID、位置整理</text><text x="42" y="373" font-size="23" fill="#172c43" font-weight="400">(超时, 0, 3)</text><text x="42" y="407" font-size="23" fill="#172c43" font-weight="400">(超时, 2, 3)</text><text x="42" y="441" font-size="23" fill="#172c43" font-weight="400">(超时, 2, 4)</text><path d="M 320 491 L 320 524" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="535" width="592" height="155" rx="9" fill="#dcf2e6"/><text x="42" y="572" font-size="25" fill="#172c43" font-weight="600">相同 docID 合成一条记录</text><text x="42" y="614" font-size="23" fill="#172c43" font-weight="400">docID 0 → 次数 1，位置 [3]</text><text x="42" y="648" font-size="23" fill="#172c43" font-weight="400">docID 2 → 次数 2，位置 [3, 4]</text><rect x="24" y="723" width="592" height="155" rx="9" fill="#eef3f7"/><text x="42" y="760" font-size="25" fill="#172c43" font-weight="600">没有改变：原文仍然存在</text><text x="42" y="802" font-size="23" fill="#172c43" font-weight="400">新增的是另一种查找方式：</text><text x="42" y="836" font-size="23" fill="#172c43" font-weight="400">给“超时”，就能找到文档 0 和 2。</text></g></svg>
