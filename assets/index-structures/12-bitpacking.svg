<svg xmlns="http://www.w3.org/2000/svg" width="640" height="902" viewBox="0 0 640 902" role="img" aria-labelledby="title desc"><title id="title">12 一块整数怎样紧凑排列</title><desc id="desc">差值数组四个数以四位宽打包，载荷十六进制为 37 19；取出后累加还原文档编号。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="902" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">12 一块整数怎样紧凑排列</text><rect x="24" y="80" width="592" height="154" rx="9" fill="#e2eefb"/><text x="42" y="117" font-size="25" fill="#172c43" font-weight="600">先做差分，得到一块小整数</text><text x="42" y="159" font-size="23" fill="#172c43" font-weight="400">docID：[3, 10, 11, 20]</text><text x="42" y="193" font-size="23" fill="#172c43" font-weight="400">差值： [3, 7, 1, 9]</text><rect x="24" y="270" width="592" height="156" rx="9" fill="#eef3f7"/><text x="42" y="307" font-size="25" fill="#172c43" font-weight="600">最大值 9，需要 4 个二进制位</text><text x="42" y="349" font-size="23" fill="#172c43" font-weight="400">3 → 0011；7 → 0111</text><text x="42" y="383" font-size="23" fill="#172c43" font-weight="400">1 → 0001；9 → 1001</text><path d="M 320 436 L 320 473" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="484" width="592" height="155" rx="9" fill="#dcf2e6"/><text x="42" y="521" font-size="25" fill="#172c43" font-weight="600">教学约定：按高位在前拼接</text><text x="42" y="563" font-size="23" fill="#172c43" font-weight="400">0011 0111 0001 1001</text><text x="42" y="597" font-size="23" fill="#172c43" font-weight="400">得到两个字节：37 19</text><rect x="24" y="675" width="592" height="155" rx="9" fill="#fff0db"/><text x="42" y="712" font-size="25" fill="#172c43" font-weight="600">解码需要知道：位宽 4、数量 4</text><text x="42" y="754" font-size="23" fill="#172c43" font-weight="400">每次取 4 位 → 3、7、1、9</text><text x="42" y="788" font-size="23" fill="#172c43" font-weight="400">再做前缀和 → 3、10、11、20</text><text x="24" y="872" font-size="22" fill="#425a70" font-weight="400">2 字节只计算载荷，不包含位宽与数量等元信息。</text></g></svg>
