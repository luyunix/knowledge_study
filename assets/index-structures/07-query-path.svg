<svg xmlns="http://www.w3.org/2000/svg" width="640" height="890" viewBox="0 0 640 890" role="img" aria-labelledby="title desc"><title id="title">07 两种访问方向怎样配合</title><desc id="desc">从查询词经词典和倒排取交集得到 docID 0，再按文档读取 D1 字段。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="890" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">07 两种访问方向怎样配合</text><rect x="24" y="80" width="592" height="124" rx="9" fill="#e2eefb"/><text x="42" y="117" font-size="25" fill="#172c43" font-weight="600">输入：部署 AND 超时</text><text x="42" y="159" font-size="23" fill="#172c43" font-weight="400">两词都必须出现在同一篇文档。</text><path d="M 320 214 L 320 251" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="263" width="592" height="158" rx="9" fill="#eef3f7"/><text x="42" y="300" font-size="25" fill="#172c43" font-weight="600">先查词典，再读取两个列表</text><text x="42" y="342" font-size="23" fill="#172c43" font-weight="400">部署 → [0, 1, 3]</text><text x="42" y="376" font-size="23" fill="#172c43" font-weight="400">超时 → [0, 2]</text><path d="M 320 431 L 320 468" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="480" width="592" height="122" rx="9" fill="#fff0db"/><text x="42" y="517" font-size="25" fill="#172c43" font-weight="600">求交集 → [0]</text><text x="42" y="559" font-size="23" fill="#172c43" font-weight="400">0 是文档编号，不是相关性排名。</text><path d="M 320 612 L 320 649" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="661" width="592" height="157" rx="9" fill="#dcf2e6"/><text x="42" y="698" font-size="25" fill="#172c43" font-weight="600">按 docID 0 读取结果字段</text><text x="42" y="740" font-size="23" fill="#172c43" font-weight="400">D1：Python 部署 超时 排查</text><text x="42" y="774" font-size="23" fill="#172c43" font-weight="400">租户 A；SDK v2</text><text x="24" y="858" font-size="23" fill="#425a70" font-weight="400">倒排定位候选；按文档取值提供结果内容。</text></g></svg>
