<svg xmlns="http://www.w3.org/2000/svg" width="640" height="920" viewBox="0 0 640 920" role="img" aria-labelledby="title desc"><title id="title">13 一个异常值，不必拖累整块</title><desc id="desc">一个大值使整块位宽增加；可另存异常位置和高位。是否更小取决于额外元数据，不保证微型示例节省字节。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="920" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">13 一个异常值，不必拖累整块</text><rect x="24" y="80" width="592" height="155" rx="9" fill="#e2eefb"/><text x="42" y="117" font-size="25" fill="#172c43" font-weight="600">换一块数据：[3, 7, 1, 129]</text><text x="42" y="159" font-size="23" fill="#172c43" font-weight="400">只有最后一个数特别大。</text><text x="42" y="193" font-size="23" fill="#172c43" font-weight="400">统一位宽需要 8 bit × 4 = 32 bit。</text><rect x="24" y="273" width="592" height="155" rx="9" fill="#fff0db"/><text x="42" y="310" font-size="25" fill="#172c43" font-weight="600">尝试只给每个数 3 bit</text><text x="42" y="352" font-size="23" fill="#172c43" font-weight="400">低位部分：[3, 7, 1, 1]</text><text x="42" y="386" font-size="23" fill="#172c43" font-weight="400">前三个数完整；129 的高位丢了。</text><rect x="24" y="466" width="592" height="155" rx="9" fill="#dcf2e6"/><text x="42" y="503" font-size="25" fill="#172c43" font-weight="600">另外记录异常位置与高位</text><text x="42" y="545" font-size="23" fill="#172c43" font-weight="400">异常下标：3；额外高位：16</text><text x="42" y="579" font-size="23" fill="#172c43" font-weight="400">129 = 1 + (16 &lt;&lt; 3)</text><rect x="24" y="659" width="592" height="188" rx="9" fill="#eef3f7"/><text x="42" y="696" font-size="25" fill="#172c43" font-weight="600">恢复时，把异常的高位补回去</text><text x="42" y="738" font-size="23" fill="#172c43" font-weight="400">普通数：按 3 bit 解码。</text><text x="42" y="772" font-size="23" fill="#172c43" font-weight="400">下标 3：1 + 128 = 129。</text><text x="42" y="806" font-size="23" fill="#172c43" font-weight="400">总成本还要加异常位置、高位和头部。</text><text x="24" y="889" font-size="22" fill="#425a70" font-weight="400">这是 PFOR 类方法的思想，不是具体 codec 规范。</text></g></svg>
