<svg xmlns="http://www.w3.org/2000/svg" width="640" height="943" viewBox="0 0 640 943" role="img" aria-labelledby="title desc"><title id="title">05 两个游标怎样求交集</title><desc id="desc">游标依次比较 0 与 0、1 与 2、3 与 2；命中 0 后右侧耗尽，返回 D1。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="943" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">05 两个游标怎样求交集</text><text x="24" y="83" font-size="23" fill="#425a70" font-weight="400">查询：部署 AND 超时；橙色 = 当前游标。</text><rect x="24" y="108" width="592" height="194" rx="9" fill="#eef3f7"/><text x="40" y="142" font-size="24" fill="#172c43" font-weight="600">第 1 步</text><text x="40" y="189" font-size="23" fill="#172c43" font-weight="400">部署</text><rect x="155" y="155" width="72" height="48" rx="9" fill="#fff0db"/><text x="171" y="188" font-size="25" fill="#172c43" font-weight="400">0</text><rect x="235" y="155" width="72" height="48" rx="9" fill="#eef3f7"/><text x="251" y="188" font-size="25" fill="#172c43" font-weight="400">1</text><rect x="315" y="155" width="72" height="48" rx="9" fill="#eef3f7"/><text x="331" y="188" font-size="25" fill="#172c43" font-weight="400">3</text><text x="40" y="248" font-size="23" fill="#172c43" font-weight="400">超时</text><rect x="155" y="214" width="72" height="48" rx="9" fill="#fff0db"/><text x="171" y="247" font-size="25" fill="#172c43" font-weight="400">0</text><rect x="235" y="214" width="72" height="48" rx="9" fill="#eef3f7"/><text x="251" y="247" font-size="25" fill="#172c43" font-weight="400">2</text><text x="412" y="192" font-size="22" fill="#425a70" font-weight="400">已收集</text><text x="412" y="237" font-size="25" fill="#172c43" font-weight="400">[] → [0]</text><text x="40" y="288" font-size="22" fill="#172c43" font-weight="400">0 = 0：收集 0；两个游标都前进。</text><rect x="24" y="323" width="592" height="194" rx="9" fill="#eef3f7"/><text x="40" y="357" font-size="24" fill="#172c43" font-weight="600">第 2 步</text><text x="40" y="404" font-size="23" fill="#172c43" font-weight="400">部署</text><rect x="155" y="370" width="72" height="48" rx="9" fill="#eef3f7"/><text x="171" y="403" font-size="25" fill="#172c43" font-weight="400">0</text><rect x="235" y="370" width="72" height="48" rx="9" fill="#fff0db"/><text x="251" y="403" font-size="25" fill="#172c43" font-weight="400">1</text><rect x="315" y="370" width="72" height="48" rx="9" fill="#eef3f7"/><text x="331" y="403" font-size="25" fill="#172c43" font-weight="400">3</text><text x="40" y="463" font-size="23" fill="#172c43" font-weight="400">超时</text><rect x="155" y="429" width="72" height="48" rx="9" fill="#eef3f7"/><text x="171" y="462" font-size="25" fill="#172c43" font-weight="400">0</text><rect x="235" y="429" width="72" height="48" rx="9" fill="#fff0db"/><text x="251" y="462" font-size="25" fill="#172c43" font-weight="400">2</text><text x="412" y="407" font-size="22" fill="#425a70" font-weight="400">已收集</text><text x="412" y="452" font-size="25" fill="#172c43" font-weight="400">[0]</text><text x="40" y="503" font-size="22" fill="#172c43" font-weight="400">1 &lt; 2：只前进“部署”的游标。</text><rect x="24" y="538" width="592" height="194" rx="9" fill="#eef3f7"/><text x="40" y="572" font-size="24" fill="#172c43" font-weight="600">第 3 步</text><text x="40" y="619" font-size="23" fill="#172c43" font-weight="400">部署</text><rect x="155" y="585" width="72" height="48" rx="9" fill="#eef3f7"/><text x="171" y="618" font-size="25" fill="#172c43" font-weight="400">0</text><rect x="235" y="585" width="72" height="48" rx="9" fill="#eef3f7"/><text x="251" y="618" font-size="25" fill="#172c43" font-weight="400">1</text><rect x="315" y="585" width="72" height="48" rx="9" fill="#fff0db"/><text x="331" y="618" font-size="25" fill="#172c43" font-weight="400">3</text><text x="40" y="678" font-size="23" fill="#172c43" font-weight="400">超时</text><rect x="155" y="644" width="72" height="48" rx="9" fill="#eef3f7"/><text x="171" y="677" font-size="25" fill="#172c43" font-weight="400">0</text><rect x="235" y="644" width="72" height="48" rx="9" fill="#fff0db"/><text x="251" y="677" font-size="25" fill="#172c43" font-weight="400">2</text><text x="412" y="622" font-size="22" fill="#425a70" font-weight="400">已收集</text><text x="412" y="667" font-size="25" fill="#172c43" font-weight="400">[0]</text><text x="40" y="718" font-size="22" fill="#172c43" font-weight="400">3 &gt; 2：只前进“超时”的游标。</text><rect x="24" y="760" width="592" height="155" rx="9" fill="#dcf2e6"/><text x="42" y="797" font-size="25" fill="#172c43" font-weight="600">“超时”列表耗尽，立即停止</text><text x="42" y="839" font-size="23" fill="#172c43" font-weight="400">交集为 [0]，对应业务文档 D1。</text><text x="42" y="873" font-size="23" fill="#172c43" font-weight="400">全程比较整数，不需要逐篇读取正文。</text></g></svg>
