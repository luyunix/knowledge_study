<svg xmlns="http://www.w3.org/2000/svg" width="640" height="938" viewBox="0 0 640 938" role="img" aria-labelledby="title desc"><title id="title">02 正排：给编号，取字段</title><desc id="desc">上半部按文档排记录；下半部按字段排数组。docID 2 在两种布局中都对应租户 B、SDK v2。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="938" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">02 正排：给编号，取字段</text><rect x="24" y="80" width="592" height="122" rx="9" fill="#e2eefb"/><text x="42" y="117" font-size="25" fill="#172c43" font-weight="600">任务：已知 docID = 2，读取它的字段</text><text x="42" y="159" font-size="23" fill="#172c43" font-weight="400">先找第 2 号记录，再读 D3 的内容与属性。</text><text x="24" y="249" font-size="23" fill="#172c43" font-weight="600">按文档组织：同一篇文档的字段放在一起</text><rect x="24" y="271" width="592" height="45" rx="9" fill="#eef3f7"/><text x="42" y="302" font-size="24" fill="#172c43" font-weight="400">0 → D1 | A | v2</text><rect x="24" y="324" width="592" height="45" rx="9" fill="#eef3f7"/><text x="42" y="355" font-size="24" fill="#172c43" font-weight="400">1 → D2 | A | v1</text><rect x="24" y="377" width="592" height="45" rx="9" fill="#fff0db"/><text x="42" y="408" font-size="24" fill="#172c43" font-weight="400">2 → D3 | B | v2</text><rect x="24" y="430" width="592" height="45" rx="9" fill="#eef3f7"/><text x="42" y="461" font-size="24" fill="#172c43" font-weight="400">3 → D4 | A | v2</text><text x="24" y="525" font-size="23" fill="#172c43" font-weight="600">按字段组织：先选列，再定位下标 2</text><text x="24" y="569" font-size="23" fill="#172c43" font-weight="400">docID</text><rect x="170" y="537" width="72" height="48" rx="9" fill="#eef3f7"/><text x="186" y="570" font-size="25" fill="#172c43" font-weight="400">0</text><rect x="250" y="537" width="72" height="48" rx="9" fill="#eef3f7"/><text x="266" y="570" font-size="25" fill="#172c43" font-weight="400">1</text><rect x="330" y="537" width="72" height="48" rx="9" fill="#fff0db"/><text x="346" y="570" font-size="25" fill="#172c43" font-weight="400">2</text><rect x="410" y="537" width="72" height="48" rx="9" fill="#eef3f7"/><text x="426" y="570" font-size="25" fill="#172c43" font-weight="400">3</text><text x="24" y="634" font-size="23" fill="#172c43" font-weight="400">租户列</text><rect x="170" y="602" width="72" height="48" rx="9" fill="#eef3f7"/><text x="186" y="635" font-size="25" fill="#172c43" font-weight="400">A</text><rect x="250" y="602" width="72" height="48" rx="9" fill="#eef3f7"/><text x="266" y="635" font-size="25" fill="#172c43" font-weight="400">A</text><rect x="330" y="602" width="72" height="48" rx="9" fill="#fff0db"/><text x="346" y="635" font-size="25" fill="#172c43" font-weight="400">B</text><rect x="410" y="602" width="72" height="48" rx="9" fill="#eef3f7"/><text x="426" y="635" font-size="25" fill="#172c43" font-weight="400">A</text><text x="24" y="699" font-size="23" fill="#172c43" font-weight="400">版本列</text><rect x="170" y="667" width="72" height="48" rx="9" fill="#eef3f7"/><text x="186" y="700" font-size="25" fill="#172c43" font-weight="400">v2</text><rect x="250" y="667" width="72" height="48" rx="9" fill="#eef3f7"/><text x="266" y="700" font-size="25" fill="#172c43" font-weight="400">v1</text><rect x="330" y="667" width="72" height="48" rx="9" fill="#fff0db"/><text x="346" y="700" font-size="25" fill="#172c43" font-weight="400">v2</text><rect x="410" y="667" width="72" height="48" rx="9" fill="#eef3f7"/><text x="426" y="700" font-size="25" fill="#172c43" font-weight="400">v2</text><rect x="24" y="755" width="592" height="155" rx="9" fill="#dcf2e6"/><text x="42" y="792" font-size="25" fill="#172c43" font-weight="600">两种布局，访问方向相同</text><text x="42" y="834" font-size="23" fill="#172c43" font-weight="400">都是从 docID 出发取字段值。</text><text x="42" y="868" font-size="23" fill="#172c43" font-weight="400">列式适合批量读取同一个字段。</text></g></svg>
