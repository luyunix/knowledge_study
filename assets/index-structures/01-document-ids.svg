<svg xmlns="http://www.w3.org/2000/svg" width="640" height="744" viewBox="0 0 640 744" role="img" aria-labelledby="title desc"><title id="title">01 先给四条文档编号</title><desc id="desc">D1 到 D4 分别映射 docID 0 到 3。词位置从 1 开始；D3 的超时出现在位置 3 和 4。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="744" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">01 先给四条文档编号</text><text x="24" y="83" font-size="23" fill="#425a70" font-weight="400">业务 ID 是名字；docID 是本段内的整数编号。</text><rect x="24" y="110" width="592" height="128" rx="9" fill="#eef3f7"/><text x="40" y="144" font-size="24" fill="#172c43" font-weight="600">D1 → docID 0</text><rect x="40" y="157" width="84" height="40" rx="9" fill="#ffffff"/><text x="45" y="185" font-size="21" fill="#172c43" font-weight="400">Python</text><text x="72" y="221" font-size="22" fill="#425a70" font-weight="400">1</text><rect x="132" y="157" width="84" height="40" rx="9" fill="#ffffff"/><text x="137" y="185" font-size="21" fill="#172c43" font-weight="400">部署</text><text x="164" y="221" font-size="22" fill="#425a70" font-weight="400">2</text><rect x="224" y="157" width="84" height="40" rx="9" fill="#fff0db"/><text x="229" y="185" font-size="21" fill="#172c43" font-weight="400">超时</text><text x="256" y="221" font-size="22" fill="#425a70" font-weight="400">3</text><rect x="316" y="157" width="84" height="40" rx="9" fill="#ffffff"/><text x="321" y="185" font-size="21" fill="#172c43" font-weight="400">排查</text><text x="348" y="221" font-size="22" fill="#425a70" font-weight="400">4</text><rect x="24" y="252" width="592" height="128" rx="9" fill="#eef3f7"/><text x="40" y="286" font-size="24" fill="#172c43" font-weight="600">D2 → docID 1</text><rect x="40" y="299" width="84" height="40" rx="9" fill="#ffffff"/><text x="45" y="327" font-size="21" fill="#172c43" font-weight="400">Java</text><text x="72" y="363" font-size="22" fill="#425a70" font-weight="400">1</text><rect x="132" y="299" width="84" height="40" rx="9" fill="#ffffff"/><text x="137" y="327" font-size="21" fill="#172c43" font-weight="400">部署</text><text x="164" y="363" font-size="22" fill="#425a70" font-weight="400">2</text><rect x="224" y="299" width="84" height="40" rx="9" fill="#ffffff"/><text x="229" y="327" font-size="21" fill="#172c43" font-weight="400">配置</text><text x="256" y="363" font-size="22" fill="#425a70" font-weight="400">3</text><rect x="316" y="299" width="84" height="40" rx="9" fill="#ffffff"/><text x="321" y="327" font-size="21" fill="#172c43" font-weight="400">指南</text><text x="348" y="363" font-size="22" fill="#425a70" font-weight="400">4</text><rect x="24" y="394" width="592" height="128" rx="9" fill="#eef3f7"/><text x="40" y="428" font-size="24" fill="#172c43" font-weight="600">D3 → docID 2</text><rect x="40" y="441" width="84" height="40" rx="9" fill="#ffffff"/><text x="45" y="469" font-size="21" fill="#172c43" font-weight="400">Python</text><text x="72" y="505" font-size="22" fill="#425a70" font-weight="400">1</text><rect x="132" y="441" width="84" height="40" rx="9" fill="#ffffff"/><text x="137" y="469" font-size="21" fill="#172c43" font-weight="400">请求</text><text x="164" y="505" font-size="22" fill="#425a70" font-weight="400">2</text><rect x="224" y="441" width="84" height="40" rx="9" fill="#fff0db"/><text x="229" y="469" font-size="21" fill="#172c43" font-weight="400">超时</text><text x="256" y="505" font-size="22" fill="#425a70" font-weight="400">3</text><rect x="316" y="441" width="84" height="40" rx="9" fill="#fff0db"/><text x="321" y="469" font-size="21" fill="#172c43" font-weight="400">超时</text><text x="348" y="505" font-size="22" fill="#425a70" font-weight="400">4</text><rect x="408" y="441" width="84" height="40" rx="9" fill="#ffffff"/><text x="413" y="469" font-size="21" fill="#172c43" font-weight="400">处理</text><text x="440" y="505" font-size="22" fill="#425a70" font-weight="400">5</text><rect x="24" y="536" width="592" height="128" rx="9" fill="#eef3f7"/><text x="40" y="570" font-size="24" fill="#172c43" font-weight="600">D4 → docID 3</text><rect x="40" y="583" width="84" height="40" rx="9" fill="#ffffff"/><text x="45" y="611" font-size="21" fill="#172c43" font-weight="400">Python</text><text x="72" y="647" font-size="22" fill="#425a70" font-weight="400">1</text><rect x="132" y="583" width="84" height="40" rx="9" fill="#ffffff"/><text x="137" y="611" font-size="21" fill="#172c43" font-weight="400">部署</text><text x="164" y="647" font-size="22" fill="#425a70" font-weight="400">2</text><rect x="224" y="583" width="84" height="40" rx="9" fill="#ffffff"/><text x="229" y="611" font-size="21" fill="#172c43" font-weight="400">参数</text><text x="256" y="647" font-size="22" fill="#425a70" font-weight="400">3</text><rect x="316" y="583" width="84" height="40" rx="9" fill="#ffffff"/><text x="321" y="611" font-size="21" fill="#172c43" font-weight="400">参数</text><text x="348" y="647" font-size="22" fill="#425a70" font-weight="400">4</text><rect x="408" y="583" width="84" height="40" rx="9" fill="#ffffff"/><text x="413" y="611" font-size="21" fill="#172c43" font-weight="400">参数</text><text x="440" y="647" font-size="22" fill="#425a70" font-weight="400">5</text><rect x="500" y="583" width="84" height="40" rx="9" fill="#ffffff"/><text x="505" y="611" font-size="21" fill="#172c43" font-weight="400">检查</text><text x="532" y="647" font-size="22" fill="#425a70" font-weight="400">6</text><text x="24" y="712" font-size="23" fill="#425a70" font-weight="400">每个词下面的数字 = 它在文档里的位置。</text></g></svg>
