<svg xmlns="http://www.w3.org/2000/svg" width="640" height="963" viewBox="0 0 640 963" role="img" aria-labelledby="title desc"><title id="title">10 FST：读字符，同时产生输出</title><desc id="desc">边标签的斜杠左侧是输入字符，右侧是本例要相加的输出。b 和 c 的路径输出不同，但剩余映射相同，故共享后续状态。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="963" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">10 FST：读字符，同时产生输出</text><text x="24" y="83" font-size="23" fill="#425a70" font-weight="400">bar→20，bat→21，car→10，cat→11</text><rect x="24" y="178" width="68" height="52" rx="9" fill="#eef3f7"/><text x="41" y="213" font-size="25" fill="#172c43" font-weight="400">S0</text><rect x="252" y="178" width="68" height="52" rx="9" fill="#e2eefb"/><text x="269" y="213" font-size="25" fill="#172c43" font-weight="400">S1</text><rect x="252" y="377" width="68" height="52" rx="9" fill="#e2eefb"/><text x="269" y="412" font-size="25" fill="#172c43" font-weight="400">S2</text><rect x="500" y="377" width="68" height="52" rx="9" fill="#dcf2e6"/><text x="517" y="412" font-size="25" fill="#172c43" font-weight="400">S3</text><path d="M92 188 C140 112 208 112 252 188" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M92 220 C140 298 208 298 252 220" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="140" y="127" font-size="23" fill="#172c43" font-weight="400">b / +20</text><text x="140" y="315" font-size="23" fill="#172c43" font-weight="400">c / +10</text><path d="M 286 240 L 286 370" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="130" y="356" font-size="23" fill="#172c43" font-weight="400">a / +0</text><path d="M320 387 C368 311 448 311 500 387" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M320 419 C368 494 448 494 500 419" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="370" y="309" font-size="23" fill="#172c43" font-weight="400">r / +0</text><text x="370" y="510" font-size="23" fill="#172c43" font-weight="400">t / +1</text><rect x="24" y="552" width="592" height="191" rx="9" fill="#dcf2e6"/><text x="42" y="589" font-size="25" fill="#172c43" font-weight="600">沿 cat 路径，把输出累加起来</text><text x="42" y="631" font-size="23" fill="#172c43" font-weight="400">读 c：S0 → S1，累计 10</text><text x="42" y="665" font-size="23" fill="#172c43" font-weight="400">读 a：S1 → S2，累计 10</text><text x="42" y="699" font-size="23" fill="#172c43" font-weight="400">读 t：S2 → S3，累计 11</text><rect x="24" y="780" width="592" height="155" rx="9" fill="#eef3f7"/><text x="42" y="817" font-size="25" fill="#172c43" font-weight="600">接受态 S3：终态输出为 0</text><text x="42" y="859" font-size="23" fill="#172c43" font-weight="400">最终结果：10 + 0 + 1 + 0 = 11。</text><text x="42" y="893" font-size="23" fill="#172c43" font-weight="400">这是手工教学 FST，不是 Lucene 字节格式。</text></g></svg>
