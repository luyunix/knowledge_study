<svg xmlns="http://www.w3.org/2000/svg" width="640" height="930" viewBox="0 0 640 930" role="img" aria-labelledby="title desc"><title id="title">03 把宕机放在两个成功之间</title><desc id="desc">写引擎后、提交前宕机导致重放。版本幂等使两次投递只改变一次状态。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="930" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">03 把宕机放在两个成功之间</text><rect x="24" y="78" width="592" height="106" rx="10" fill="#e2eefb"/><text x="42" y="115" font-size="25" fill="#172c43" font-weight="600">起点：恢复位置 100；价格 100</text><text x="42" y="155" font-size="23" fill="#172c43" font-weight="400">p0 / offset 100：版本 8，价格设为 80</text><path d="M320 194 L320 225" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="237" width="592" height="140" rx="10" fill="#dcf2e6"/><text x="42" y="274" font-size="25" fill="#172c43" font-weight="600">① 引擎写入成功</text><text x="42" y="314" font-size="23" fill="#172c43" font-weight="400">引擎：价格 80，版本 8</text><text x="42" y="348" font-size="23" fill="#172c43" font-weight="400">组的恢复位置：仍然是 100</text><rect x="24" y="405" width="592" height="106" rx="10" fill="#ffe2e0"/><text x="42" y="442" font-size="25" fill="#172c43" font-weight="600">② 宕机：还没来得及提交 101</text><text x="42" y="482" font-size="23" fill="#172c43" font-weight="400">引擎状态保留；本机在途工作消失。</text><path d="M320 520 L320 552" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="564" width="592" height="140" rx="10" fill="#fff0db"/><text x="42" y="601" font-size="25" fill="#172c43" font-weight="600">③ 重启，从已提交位置 100 读取</text><text x="42" y="641" font-size="23" fill="#172c43" font-weight="400">再次收到：版本 8，价格设为 80</text><text x="42" y="675" font-size="23" fill="#172c43" font-weight="400">发现相同版本和内容 → 无需再次改变状态。</text><path d="M320 714 L320 746" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="758" width="592" height="140" rx="10" fill="#dcf2e6"/><text x="42" y="795" font-size="25" fill="#172c43" font-weight="600">④ 提交 101：下次从这里恢复</text><text x="42" y="835" font-size="23" fill="#172c43" font-weight="400">投递尝试 2 次；状态变化 1 次。</text><text x="42" y="869" font-size="23" fill="#172c43" font-weight="400">重复投递 ≠ 重复生效。</text></g></svg>
