<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" role="img" aria-labelledby="title desc"><title id="title">02 消费者分工，不等于引擎复制</title><desc id="desc">p0 分配 C1，p1 分配 C2。消费者组分工后写引擎；引擎副本一致性由自己的复制协议负责。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="1000" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">02 消费者分工，不等于引擎复制</text><text x="24" y="87" font-size="23" fill="#425a70" font-weight="400">同组成员分工；不是每人收到全部消息。</text><rect x="24" y="116" width="284" height="138" rx="10" fill="#e2eefb"/><text x="42" y="153" font-size="25" fill="#172c43" font-weight="600">分区 p0</text><text x="42" y="194" font-size="23" fill="#172c43" font-weight="400">P42 的变化</text><text x="42" y="231" font-size="23" fill="#172c43" font-weight="400">各自有一串 offset</text><path d="M166 264 L166 304" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="318" width="284" height="105" rx="10" fill="#dcf2e6"/><text x="42" y="356" font-size="25" fill="#172c43" font-weight="600">接入实例 C1</text><text x="42" y="397" font-size="23" fill="#172c43" font-weight="400">组：index-G1</text><rect x="332" y="116" width="284" height="138" rx="10" fill="#e2eefb"/><text x="350" y="153" font-size="25" fill="#172c43" font-weight="600">分区 p1</text><text x="350" y="194" font-size="23" fill="#172c43" font-weight="400">P17 的变化</text><text x="350" y="231" font-size="23" fill="#172c43" font-weight="400">各自有一串 offset</text><path d="M474 264 L474 304" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="332" y="318" width="284" height="105" rx="10" fill="#dcf2e6"/><text x="350" y="356" font-size="25" fill="#172c43" font-weight="600">接入实例 C2</text><text x="350" y="397" font-size="23" fill="#172c43" font-weight="400">组：index-G1</text><path d="M166 435 L260 485" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M474 435 L380 485" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="499" width="592" height="106" rx="10" fill="#eef3f7"/><text x="42" y="536" font-size="25" fill="#172c43" font-weight="600">接入层按业务 ID 路由到引擎分片</text><text x="42" y="576" font-size="23" fill="#172c43" font-weight="400">例如 C1 将 P42 写到引擎分片 S0。</text><path d="M320 615 L320 647" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="659" width="592" height="140" rx="10" fill="#e2eefb"/><text x="42" y="696" font-size="25" fill="#172c43" font-weight="600">引擎分片 S0：自己维护副本</text><text x="42" y="736" font-size="23" fill="#172c43" font-weight="400">主副本接收写入 → 按引擎协议复制</text><text x="42" y="770" font-size="23" fill="#172c43" font-weight="400">查询副本须恢复就绪，才能承接流量。</text><rect x="24" y="829" width="592" height="140" rx="10" fill="#fff0db"/><text x="42" y="866" font-size="25" fill="#172c43" font-weight="600">错误接法：完整副本 A/B 同组分工</text><text x="42" y="906" font-size="23" fill="#172c43" font-weight="400">A 只收到 p0，B 只收到 p1，都会缺数据。</text><text x="42" y="940" font-size="23" fill="#172c43" font-weight="400">若独立重放，必须让每个副本读到所需流。</text></g></svg>
