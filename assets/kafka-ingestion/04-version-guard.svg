<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1088" viewBox="0 0 640 1088" role="img" aria-labelledby="title desc"><title id="title">04 去重之外，还要防旧状态覆盖</title><desc id="desc">七个状态逐步显示重复、旧版本、删除与旧消息重放。相同版本不同内容属于异常。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="1088" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">04 去重之外，还要防旧状态覆盖</text><text x="24" y="88" font-size="23" fill="#425a70" font-weight="400">原子保存：业务版本 + 正文 + 删除状态。</text><rect x="24" y="112" width="592" height="106" rx="10" fill="#eef3f7"/><text x="42" y="149" font-size="25" fill="#172c43" font-weight="600">起始状态</text><text x="42" y="189" font-size="23" fill="#172c43" font-weight="400">版本 7，价格 100</text><rect x="24" y="243" width="592" height="106" rx="10" fill="#dcf2e6"/><text x="42" y="280" font-size="25" fill="#172c43" font-weight="600">收到版本 8，价格 80</text><text x="42" y="320" font-size="23" fill="#172c43" font-weight="400">8 &gt; 7：应用 → (8, 80)</text><rect x="24" y="374" width="592" height="106" rx="10" fill="#e2eefb"/><text x="42" y="411" font-size="25" fill="#172c43" font-weight="600">又收到版本 8，价格 80</text><text x="42" y="451" font-size="23" fill="#172c43" font-weight="400">版本和内容相同：不再改变</text><rect x="24" y="505" width="592" height="106" rx="10" fill="#dcf2e6"/><text x="42" y="542" font-size="25" fill="#172c43" font-weight="600">收到版本 9，价格 75</text><text x="42" y="582" font-size="23" fill="#172c43" font-weight="400">9 &gt; 8：应用 → (9, 75)</text><rect x="24" y="636" width="592" height="106" rx="10" fill="#fff0db"/><text x="42" y="673" font-size="25" fill="#172c43" font-weight="600">迟来版本 8，价格 80</text><text x="42" y="713" font-size="23" fill="#172c43" font-weight="400">8 &lt; 9：拒绝旧状态，仍是 75</text><rect x="24" y="767" width="592" height="106" rx="10" fill="#dcf2e6"/><text x="42" y="804" font-size="25" fill="#172c43" font-weight="600">收到版本 10，删除</text><text x="42" y="844" font-size="23" fill="#172c43" font-weight="400">保留 (10, 已删除)，搜索不返回</text><rect x="24" y="898" width="592" height="106" rx="10" fill="#fff0db"/><text x="42" y="935" font-size="25" fill="#172c43" font-weight="600">再来版本 8，价格 80</text><text x="42" y="975" font-size="23" fill="#172c43" font-weight="400">8 &lt; 10：不允许商品复活</text><text x="24" y="1057" font-size="23" fill="#425a70" font-weight="400">同版本内容不同：报冲突，不当作正常重试。</text></g></svg>
