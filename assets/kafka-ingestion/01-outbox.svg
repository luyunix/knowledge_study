<svg xmlns="http://www.w3.org/2000/svg" width="640" height="966" viewBox="0 0 640 966" role="img" aria-labelledby="title desc"><title id="title">01 改数据时，也留下可靠的待办</title><desc id="desc">数据库商品行与 Outbox 同事务；Kafka 与引擎在事务边界外，通过允许重试衔接。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="966" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">01 改数据时，也留下可靠的待办</text><rect x="24" y="78" width="592" height="106" rx="10" fill="#e2eefb"/><text x="42" y="115" font-size="25" fill="#172c43" font-weight="600">初始：P42 价格 100，业务版本 7</text><text x="42" y="155" font-size="23" fill="#172c43" font-weight="400">目标：改成 80，并让搜索随后更新。</text><path d="M320 194 L320 224" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="236" width="592" height="140" rx="10" fill="#dcf2e6"/><text x="42" y="273" font-size="25" fill="#172c43" font-weight="600">① 一个数据库事务，一起提交</text><text x="42" y="313" font-size="23" fill="#172c43" font-weight="400">商品表：P42 → 价格 80，版本 8</text><text x="42" y="347" font-size="23" fill="#172c43" font-weight="400">Outbox：evt-P42-8 → 待发送</text><path d="M320 386 L320 418" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="430" width="592" height="140" rx="10" fill="#eef3f7"/><text x="42" y="467" font-size="25" fill="#172c43" font-weight="600">② 独立搬运程序发送事件</text><text x="42" y="507" font-size="23" fill="#172c43" font-weight="400">Kafka key = shopA:P42</text><text x="42" y="541" font-size="23" fill="#172c43" font-weight="400">收到确认后记录发送进度；允许重试。</text><path d="M320 580 L320 612" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="624" width="592" height="140" rx="10" fill="#e2eefb"/><text x="42" y="661" font-size="25" fill="#172c43" font-weight="600">③ 消费并写入引擎，再变成可见</text><text x="42" y="701" font-size="23" fill="#172c43" font-weight="400">引擎可靠保存：价格 80，版本 8</text><text x="42" y="735" font-size="23" fill="#172c43" font-weight="400">查询视图刷新后：搜索返回 80。</text><rect x="24" y="794" width="592" height="140" rx="10" fill="#fff0db"/><text x="42" y="831" font-size="25" fill="#172c43" font-weight="600">检查故障：搬运程序现在死了？</text><text x="42" y="871" font-size="23" fill="#172c43" font-weight="400">商品与 Outbox 已一起提交，不会丢待办。</text><text x="42" y="905" font-size="23" fill="#172c43" font-weight="400">但再次发送可能重复，后面仍需幂等。</text></g></svg>
