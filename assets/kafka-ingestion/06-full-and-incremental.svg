<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1002" viewBox="0 0 640 1002" role="img" aria-labelledby="title desc"><title id="title">06 构建期间的变化，靠重放补齐</title><desc id="desc">快照与源日志协议建立边界；G2 构建时保留增量，加载后追赶再验证切换。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="1002" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">06 构建期间的变化，靠重放补齐</text><rect x="24" y="78" width="592" height="140" rx="10" fill="#e2eefb"/><text x="42" y="115" font-size="25" fill="#172c43" font-weight="600">① 一致性快照 + 可追溯重放边界</text><text x="42" y="155" font-size="23" fill="#172c43" font-weight="400">快照 S：P42 = (版本 7，价格 100)</text><text x="42" y="189" font-size="23" fill="#172c43" font-weight="400">简化示例：后续从 p0 / offset 100 重放。</text><path d="M320 228 L320 260" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="272" width="592" height="140" rx="10" fill="#fff0db"/><text x="42" y="309" font-size="25" fill="#172c43" font-weight="600">② G1 服务；用快照构建新代次 G2</text><text x="42" y="349" font-size="23" fill="#172c43" font-weight="400">构建期间业务继续变化，Kafka 保留增量：</text><text x="42" y="383" font-size="23" fill="#172c43" font-weight="400">100 → (8, 80)；101 → (9, 75)</text><path d="M320 422 L320 454" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="466" width="592" height="140" rx="10" fill="#dcf2e6"/><text x="42" y="503" font-size="25" fill="#172c43" font-weight="600">③ G2 加载后，从 100 追赶</text><text x="42" y="543" font-size="23" fill="#172c43" font-weight="400">G2：(7, 100) → (8, 80) → (9, 75)</text><text x="42" y="577" font-size="23" fill="#172c43" font-weight="400">安全恢复位置推进到 102，继续跟随新数据。</text><path d="M320 616 L320 648" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="660" width="592" height="140" rx="10" fill="#e2eefb"/><text x="42" y="697" font-size="25" fill="#172c43" font-weight="600">④ 达到切换门槛，路由到 G2</text><text x="42" y="737" font-size="23" fill="#172c43" font-weight="400">校验各分区进度、查询可见与数据完整性。</text><text x="42" y="771" font-size="23" fill="#172c43" font-weight="400">继续增量消费；保留可恢复的旧代次。</text><rect x="24" y="830" width="592" height="140" rx="10" fill="#eef3f7"/><text x="42" y="867" font-size="25" fill="#172c43" font-weight="600">图中只画一个分区，便于推演</text><text x="42" y="907" font-size="23" fill="#172c43" font-weight="400">真实边界通常是位置向量，不是一个时间。</text><text x="42" y="941" font-size="23" fill="#172c43" font-weight="400">G1 已处理，不能成为 G2 跳过事件的理由。</text></g></svg>
