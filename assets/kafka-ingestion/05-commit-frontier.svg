<svg xmlns="http://www.w3.org/2000/svg" width="640" height="928" viewBox="0 0 640 928" role="img" aria-labelledby="title desc"><title id="title">05 提交进度不能越过未完成的洞</title><desc id="desc">100 未完成而 101、102 完成时不能提交 103。100 也完成后才推进到 103。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="928" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">05 提交进度不能越过未完成的洞</text><rect x="24" y="78" width="592" height="106" rx="10" fill="#e2eefb"/><text x="42" y="115" font-size="25" fill="#172c43" font-weight="600">p0 已投递：100、101、102</text><text x="42" y="155" font-size="23" fill="#172c43" font-weight="400">初始恢复位置为 100；工作线程并行执行。</text><rect x="24" y="235" width="184" height="116" rx="10" fill="#fff0db"/><text x="40" y="274" font-size="25" fill="#172c43" font-weight="600">offset 100</text><text x="40" y="319" font-size="23" fill="#172c43" font-weight="400">还在重试</text><rect x="228" y="235" width="184" height="116" rx="10" fill="#dcf2e6"/><text x="244" y="274" font-size="25" fill="#172c43" font-weight="600">offset 101</text><text x="244" y="319" font-size="23" fill="#172c43" font-weight="400">可靠完成</text><rect x="432" y="235" width="184" height="116" rx="10" fill="#dcf2e6"/><text x="448" y="274" font-size="25" fill="#172c43" font-weight="600">offset 102</text><text x="448" y="319" font-size="23" fill="#172c43" font-weight="400">可靠完成</text><rect x="24" y="390" width="592" height="140" rx="10" fill="#ffe2e0"/><text x="42" y="427" font-size="25" fill="#172c43" font-weight="600">现在最多只能保留恢复位置 100</text><text x="42" y="467" font-size="23" fill="#172c43" font-weight="400">如果提交 103，重启会跳过未完成的 100。</text><text x="42" y="501" font-size="23" fill="#172c43" font-weight="400">成功的最大编号 ≠ 安全提交位置。</text><path d="M320 541 L320 574" stroke="#425a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="586" width="592" height="140" rx="10" fill="#dcf2e6"/><text x="42" y="623" font-size="25" fill="#172c43" font-weight="600">稍后：100 也可靠完成了</text><text x="42" y="663" font-size="23" fill="#172c43" font-weight="400">100 ✓    101 ✓    102 ✓</text><text x="42" y="697" font-size="23" fill="#172c43" font-weight="400">已完成前缀覆盖全部三条，才可提交 103。</text><rect x="24" y="756" width="592" height="140" rx="10" fill="#eef3f7"/><text x="42" y="793" font-size="25" fill="#172c43" font-weight="600">真实日志的 offset 可能不连续</text><text x="42" y="833" font-size="23" fill="#172c43" font-weight="400">按实际投递顺序跟踪，不等待缺失整数。</text><text x="42" y="867" font-size="23" fill="#172c43" font-weight="400">不同分区分别计算，不能共用一个最大值。</text></g></svg>
