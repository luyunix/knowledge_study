<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080" role="img" aria-labelledby="title desc"><title id="title">07 副本数、ISR、确认门槛分开看</title><desc id="desc">三种状态分别显示 ISR 为 3、2、1 时的写入确认条件。控制器多数派属于独立机制。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="1080" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">07 副本数、ISR、确认门槛分开看</text><text x="24" y="87" font-size="23" fill="#425a70" font-weight="400">教学条件：3 副本，minISR=2，acks=all</text><text x="24" y="123" font-size="23" fill="#425a70" font-weight="400">传统 ISR 模型；未启用 ELR。</text><text x="24" y="181" font-size="25" fill="#172c43" font-weight="600">情况 A：三个副本都在 ISR</text><rect x="24" y="205" width="184" height="62" rx="10" fill="#e2eefb"/><text x="39" y="244" font-size="24" fill="#172c43" font-weight="400">B1 主</text><rect x="228" y="205" width="184" height="62" rx="10" fill="#dcf2e6"/><text x="243" y="244" font-size="24" fill="#172c43" font-weight="400">B2 同步</text><rect x="432" y="205" width="184" height="62" rx="10" fill="#dcf2e6"/><text x="447" y="244" font-size="24" fill="#172c43" font-weight="400">B3 同步</text><text x="24" y="307" font-size="23" fill="#172c43" font-weight="400">当前 ISR = {B1, B2, B3}；都确认才成功。</text><text x="24" y="376" font-size="25" fill="#172c43" font-weight="600">情况 B：B3 故障，已移出 ISR</text><rect x="24" y="400" width="184" height="62" rx="10" fill="#e2eefb"/><text x="39" y="439" font-size="24" fill="#172c43" font-weight="400">B1 主</text><rect x="228" y="400" width="184" height="62" rx="10" fill="#dcf2e6"/><text x="243" y="439" font-size="24" fill="#172c43" font-weight="400">B2 同步</text><rect x="432" y="400" width="184" height="62" rx="10" fill="#ffe2e0"/><text x="447" y="439" font-size="24" fill="#172c43" font-weight="400">B3 故障</text><text x="24" y="502" font-size="23" fill="#172c43" font-weight="400">当前 ISR = {B1, B2}；满足 2，仍可写。</text><text x="24" y="571" font-size="25" fill="#172c43" font-weight="600">情况 C：再失去 B2，只剩一个</text><rect x="24" y="595" width="184" height="62" rx="10" fill="#e2eefb"/><text x="39" y="634" font-size="24" fill="#172c43" font-weight="400">B1 主</text><rect x="228" y="595" width="184" height="62" rx="10" fill="#ffe2e0"/><text x="243" y="634" font-size="24" fill="#172c43" font-weight="400">B2 故障</text><rect x="432" y="595" width="184" height="62" rx="10" fill="#ffe2e0"/><text x="447" y="634" font-size="24" fill="#172c43" font-weight="400">B3 故障</text><text x="24" y="697" font-size="23" fill="#172c43" font-weight="400">当前 ISR = {B1}；不足 2，不能确认成功。</text><rect x="24" y="738" width="592" height="140" rx="10" fill="#fff0db"/><text x="42" y="775" font-size="25" fill="#172c43" font-weight="600">这是一种取舍，不是绝对不出故障</text><text x="42" y="815" font-size="23" fill="#172c43" font-weight="400">副本不足时停止承诺成功写入。</text><text x="42" y="849" font-size="23" fill="#172c43" font-weight="400">选主过程仍可能短暂不可用，需要重试。</text><rect x="24" y="908" width="592" height="140" rx="10" fill="#e2eefb"/><text x="42" y="945" font-size="25" fill="#172c43" font-weight="600">另一套机制：KRaft 控制器仲裁</text><text x="42" y="985" font-size="23" fill="#172c43" font-weight="400">三个投票控制器需要多数派存活。</text><text x="42" y="1019" font-size="23" fill="#172c43" font-weight="400">不要把控制器仲裁当成数据分区的 ISR。</text></g></svg>
