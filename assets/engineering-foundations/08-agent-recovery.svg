<svg xmlns="http://www.w3.org/2000/svg" width="640" height="864" viewBox="0 0 640 864" role="img" aria-labelledby="title desc"><title id="title">08 工具结果未知，不等于执行失败</title><desc id="desc">① 先保存调用意图: operation_id = op-42；目标环境 test；权限、参数与执行版本可追溯。。② 工具已创建部署，但响应丢失: 工具端：op-42 → 部署 D7 已成功；Agent 端：尚未记录成功，随后崩溃。。③ 恢复：先查询稳定操作 ID: 查询 op-42，得知 D7 已存在。；补记结果，不再次创建 D8。。④ 工具没有查询/幂等能力呢: 未知状态可能需要人工核验或补偿。；整任务从头重跑不等于可靠断点恢复。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="864" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">08 工具结果未知，不等于执行失败</text><text x="24" y="86" font-size="23" fill="#172c43" font-weight="400">例子：已获授权，创建一个测试部署。</text><rect x="24" y="112" width="592" height="144" rx="10" fill="#e2eefb"/><text x="42" y="149" font-size="25" fill="#172c43" font-weight="600">① 先保存调用意图</text><text x="42" y="191" font-size="23" fill="#172c43" font-weight="400">operation_id = op-42；目标环境 test</text><text x="42" y="225" font-size="23" fill="#172c43" font-weight="400">权限、参数与执行版本可追溯。</text><path d="M320 265 L320 291" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="304" width="592" height="144" rx="10" fill="#fff0db"/><text x="42" y="341" font-size="25" fill="#172c43" font-weight="600">② 工具已创建部署，但响应丢失</text><text x="42" y="383" font-size="23" fill="#172c43" font-weight="400">工具端：op-42 → 部署 D7 已成功</text><text x="42" y="417" font-size="23" fill="#172c43" font-weight="400">Agent 端：尚未记录成功，随后崩溃。</text><path d="M320 457 L320 483" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="496" width="592" height="144" rx="10" fill="#dcf2e6"/><text x="42" y="533" font-size="25" fill="#172c43" font-weight="600">③ 恢复：先查询稳定操作 ID</text><text x="42" y="575" font-size="23" fill="#172c43" font-weight="400">查询 op-42，得知 D7 已存在。</text><text x="42" y="609" font-size="23" fill="#172c43" font-weight="400">补记结果，不再次创建 D8。</text><path d="M320 649 L320 675" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="688" width="592" height="144" rx="10" fill="#ffe2e0"/><text x="42" y="725" font-size="25" fill="#172c43" font-weight="600">④ 工具没有查询/幂等能力呢</text><text x="42" y="767" font-size="23" fill="#172c43" font-weight="400">未知状态可能需要人工核验或补偿。</text><text x="42" y="801" font-size="23" fill="#172c43" font-weight="400">整任务从头重跑不等于可靠断点恢复。</text></g></svg>
