<svg xmlns="http://www.w3.org/2000/svg" width="640" height="864" viewBox="0 0 640 864" role="img" aria-labelledby="title desc"><title id="title">06 重试失败片，不混用不同运行</title><desc id="desc">① 稳定分成三个逻辑分片: shard 0:[0,3,6]；shard 1:[1,4,7]；shard 2:[2,5,8]。② 各片独立生成隔离产物: shard 0 ✓；shard 1 ✓；shard 2 ×；成功片：有完整 manifest 与已提交状态。。③ shard 2 发起新 attempt: 继续使用 S3/C5，校验后提交该片完成。；不可拿其他快照的文件凑齐数量。。④ 完整性通过，再走加载与发布: 分片齐全 ≠ 内容正确 ≠ 查询已就绪。；逐层核验后才能切换在线目标。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="864" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">06 重试失败片，不混用不同运行</text><text x="24" y="86" font-size="23" fill="#172c43" font-weight="400">同一运行 R8：快照 S3、构建定义 C5。</text><rect x="24" y="112" width="592" height="144" rx="10" fill="#e2eefb"/><text x="42" y="149" font-size="25" fill="#172c43" font-weight="600">① 稳定分成三个逻辑分片</text><text x="42" y="191" font-size="23" fill="#172c43" font-weight="400">shard 0:[0,3,6]；shard 1:[1,4,7]</text><text x="42" y="225" font-size="23" fill="#172c43" font-weight="400">shard 2:[2,5,8]</text><path d="M320 265 L320 291" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="304" width="592" height="144" rx="10" fill="#fff0db"/><text x="42" y="341" font-size="25" fill="#172c43" font-weight="600">② 各片独立生成隔离产物</text><text x="42" y="383" font-size="23" fill="#172c43" font-weight="400">shard 0 ✓；shard 1 ✓；shard 2 ×</text><text x="42" y="417" font-size="23" fill="#172c43" font-weight="400">成功片：有完整 manifest 与已提交状态。</text><path d="M320 457 L320 483" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="496" width="592" height="144" rx="10" fill="#dcf2e6"/><text x="42" y="533" font-size="25" fill="#172c43" font-weight="600">③ shard 2 发起新 attempt</text><text x="42" y="575" font-size="23" fill="#172c43" font-weight="400">继续使用 S3/C5，校验后提交该片完成。</text><text x="42" y="609" font-size="23" fill="#172c43" font-weight="400">不可拿其他快照的文件凑齐数量。</text><path d="M320 649 L320 675" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="688" width="592" height="144" rx="10" fill="#dcf2e6"/><text x="42" y="725" font-size="25" fill="#172c43" font-weight="600">④ 完整性通过，再走加载与发布</text><text x="42" y="767" font-size="23" fill="#172c43" font-weight="400">分片齐全 ≠ 内容正确 ≠ 查询已就绪。</text><text x="42" y="801" font-size="23" fill="#172c43" font-weight="400">逐层核验后才能切换在线目标。</text></g></svg>
