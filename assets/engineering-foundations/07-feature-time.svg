<svg xmlns="http://www.w3.org/2000/svg" width="640" height="864" viewBox="0 0 640 864" role="img" aria-labelledby="title desc"><title id="title">07 不要把未来信息带回过去</title><desc id="desc">① 已发生且当时可用: 09:50 点击；09:51 已到达系统。；10:00 的样本可以使用这条记录。。② 未来事件，不能使用: 10:05 又点击一次。；把它算进 10:00 特征，就是看到了未来。。③ 迟到事件，要核对可用性: 另一事件发生于 09:58，10:03 才到。；只看发生时间，可能夸大线上当时的信息。。④ 按样本目标建立时间契约: 事件时间、到达时间、特征版本分开记录。；历史关联不能直接拿今天的最新值。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="864" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">07 不要把未来信息带回过去</text><text x="24" y="86" font-size="23" fill="#172c43" font-weight="400">目标：重现用户在 10:00 时的一次预测。</text><rect x="24" y="112" width="592" height="144" rx="10" fill="#dcf2e6"/><text x="42" y="149" font-size="25" fill="#172c43" font-weight="600">① 已发生且当时可用</text><text x="42" y="191" font-size="23" fill="#172c43" font-weight="400">09:50 点击；09:51 已到达系统。</text><text x="42" y="225" font-size="23" fill="#172c43" font-weight="400">10:00 的样本可以使用这条记录。</text><path d="M320 265 L320 291" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="304" width="592" height="144" rx="10" fill="#ffe2e0"/><text x="42" y="341" font-size="25" fill="#172c43" font-weight="600">② 未来事件，不能使用</text><text x="42" y="383" font-size="23" fill="#172c43" font-weight="400">10:05 又点击一次。</text><text x="42" y="417" font-size="23" fill="#172c43" font-weight="400">把它算进 10:00 特征，就是看到了未来。</text><path d="M320 457 L320 483" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="496" width="592" height="144" rx="10" fill="#fff0db"/><text x="42" y="533" font-size="25" fill="#172c43" font-weight="600">③ 迟到事件，要核对可用性</text><text x="42" y="575" font-size="23" fill="#172c43" font-weight="400">另一事件发生于 09:58，10:03 才到。</text><text x="42" y="609" font-size="23" fill="#172c43" font-weight="400">只看发生时间，可能夸大线上当时的信息。</text><path d="M320 649 L320 675" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="688" width="592" height="144" rx="10" fill="#e2eefb"/><text x="42" y="725" font-size="25" fill="#172c43" font-weight="600">④ 按样本目标建立时间契约</text><text x="42" y="767" font-size="23" fill="#172c43" font-weight="400">事件时间、到达时间、特征版本分开记录。</text><text x="42" y="801" font-size="23" fill="#172c43" font-weight="400">历史关联不能直接拿今天的最新值。</text></g></svg>
