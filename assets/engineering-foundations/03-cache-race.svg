<svg xmlns="http://www.w3.org/2000/svg" width="640" height="830" viewBox="0 0 640 830" role="img" aria-labelledby="title desc"><title id="title">03 先改库再删缓存，仍有并发窗口</title><desc id="desc">① 读请求 R 查数据库: 读到旧价格 100，尚未回填缓存。。② 写请求 W 更新并失效缓存: 数据库改为 80，提交成功。；随后删除缓存中的旧条目。。③ 先前的 R 此时才回填: R 把自己先前读到的 100 放入缓存。；数据库 = 80；缓存 = 100。。这说明什么: TTL 限制部分陈旧窗口，不是原子一致性。；需先确定陈旧容忍度，再选缓存协议。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="830" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">03 先改库再删缓存，仍有并发窗口</text><text x="24" y="86" font-size="23" fill="#172c43" font-weight="400">数据库初值 100；缓存未命中。</text><rect x="24" y="112" width="592" height="110" rx="10" fill="#e2eefb"/><text x="42" y="149" font-size="25" fill="#172c43" font-weight="600">① 读请求 R 查数据库</text><text x="42" y="191" font-size="23" fill="#172c43" font-weight="400">读到旧价格 100，尚未回填缓存。</text><path d="M320 231 L320 257" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="270" width="592" height="144" rx="10" fill="#dcf2e6"/><text x="42" y="307" font-size="25" fill="#172c43" font-weight="600">② 写请求 W 更新并失效缓存</text><text x="42" y="349" font-size="23" fill="#172c43" font-weight="400">数据库改为 80，提交成功。</text><text x="42" y="383" font-size="23" fill="#172c43" font-weight="400">随后删除缓存中的旧条目。</text><path d="M320 423 L320 449" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="462" width="592" height="144" rx="10" fill="#ffe2e0"/><text x="42" y="499" font-size="25" fill="#172c43" font-weight="600">③ 先前的 R 此时才回填</text><text x="42" y="541" font-size="23" fill="#172c43" font-weight="400">R 把自己先前读到的 100 放入缓存。</text><text x="42" y="575" font-size="23" fill="#172c43" font-weight="400">数据库 = 80；缓存 = 100。</text><path d="M320 615 L320 641" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="654" width="592" height="144" rx="10" fill="#fff0db"/><text x="42" y="691" font-size="25" fill="#172c43" font-weight="600">这说明什么</text><text x="42" y="733" font-size="23" fill="#172c43" font-weight="400">TTL 限制部分陈旧窗口，不是原子一致性。</text><text x="42" y="767" font-size="23" fill="#172c43" font-weight="400">需先确定陈旧容忍度，再选缓存协议。</text></g></svg>
