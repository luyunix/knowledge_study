<svg xmlns="http://www.w3.org/2000/svg" width="640" height="898" viewBox="0 0 640 898" role="img" aria-labelledby="title desc"><title id="title">04 联合索引是一种具体的排列</title><desc id="desc">先固定前缀 (cluster_id, status): 只看 (7, READY) 这一段。；集群 8、DONE 状态不在目标段。。后续按 priority↓、time↑、id↑: (9, 10:00, 10)；(9, 10:01, 11)；(3, 09:00, 12)。取前两条：id 10、11: 当前条目顺序满足查询的排序要求。；是否采用此路径，还要看实际执行计划。。若先按时间排，会怎样: 09:00 的 id 12 先出现，但优先级较低。；时间有序不等于目标优先级有序。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="898" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">04 联合索引是一种具体的排列</text><text x="24" y="86" font-size="23" fill="#172c43" font-weight="400">任务查询：集群 7、READY、优先级降序。</text><rect x="24" y="112" width="592" height="144" rx="10" fill="#e2eefb"/><text x="42" y="149" font-size="25" fill="#172c43" font-weight="600">先固定前缀 (cluster_id, status)</text><text x="42" y="191" font-size="23" fill="#172c43" font-weight="400">只看 (7, READY) 这一段。</text><text x="42" y="225" font-size="23" fill="#172c43" font-weight="400">集群 8、DONE 状态不在目标段。</text><path d="M320 265 L320 291" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="304" width="592" height="178" rx="10" fill="#dcf2e6"/><text x="42" y="341" font-size="25" fill="#172c43" font-weight="600">后续按 priority↓、time↑、id↑</text><text x="42" y="383" font-size="23" fill="#172c43" font-weight="400">(9, 10:00, 10)</text><text x="42" y="417" font-size="23" fill="#172c43" font-weight="400">(9, 10:01, 11)</text><text x="42" y="451" font-size="23" fill="#172c43" font-weight="400">(3, 09:00, 12)</text><path d="M320 491 L320 517" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="530" width="592" height="144" rx="10" fill="#dcf2e6"/><text x="42" y="567" font-size="25" fill="#172c43" font-weight="600">取前两条：id 10、11</text><text x="42" y="609" font-size="23" fill="#172c43" font-weight="400">当前条目顺序满足查询的排序要求。</text><text x="42" y="643" font-size="23" fill="#172c43" font-weight="400">是否采用此路径，还要看实际执行计划。</text><path d="M320 683 L320 709" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="722" width="592" height="144" rx="10" fill="#fff0db"/><text x="42" y="759" font-size="25" fill="#172c43" font-weight="600">若先按时间排，会怎样</text><text x="42" y="801" font-size="23" fill="#172c43" font-weight="400">09:00 的 id 12 先出现，但优先级较低。</text><text x="42" y="835" font-size="23" fill="#172c43" font-weight="400">时间有序不等于目标优先级有序。</text></g></svg>
