<svg xmlns="http://www.w3.org/2000/svg" width="640" height="864" viewBox="0 0 640 864" role="img" aria-labelledby="title desc"><title id="title">05 发布成功与接管流量分开看</title><desc id="desc">① 启动 B，还不接业务流量: 完成代码、依赖、配置与业务预热。；进程 Running 不等于业务就绪。。② 就绪后，小流量进入 B: 记录实际命中版本、实例与路由代次。；观察错误、延迟和业务验收。。③ B 出错，路由回退到 A: 停止向 B 发送新请求，控制配置传播。；B 中已有请求并不会自动消失。。④ 排空或按协议处理在途请求: 已产生的副作用不能靠改路由撤销。；截止时间、幂等与补偿分别处理。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="864" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">05 发布成功与接管流量分开看</text><text x="24" y="86" font-size="23" fill="#172c43" font-weight="400">旧版本 A 在服务；准备新版本 B。</text><rect x="24" y="112" width="592" height="144" rx="10" fill="#e2eefb"/><text x="42" y="149" font-size="25" fill="#172c43" font-weight="600">① 启动 B，还不接业务流量</text><text x="42" y="191" font-size="23" fill="#172c43" font-weight="400">完成代码、依赖、配置与业务预热。</text><text x="42" y="225" font-size="23" fill="#172c43" font-weight="400">进程 Running 不等于业务就绪。</text><path d="M320 265 L320 291" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="304" width="592" height="144" rx="10" fill="#dcf2e6"/><text x="42" y="341" font-size="25" fill="#172c43" font-weight="600">② 就绪后，小流量进入 B</text><text x="42" y="383" font-size="23" fill="#172c43" font-weight="400">记录实际命中版本、实例与路由代次。</text><text x="42" y="417" font-size="23" fill="#172c43" font-weight="400">观察错误、延迟和业务验收。</text><path d="M320 457 L320 483" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="496" width="592" height="144" rx="10" fill="#fff0db"/><text x="42" y="533" font-size="25" fill="#172c43" font-weight="600">③ B 出错，路由回退到 A</text><text x="42" y="575" font-size="23" fill="#172c43" font-weight="400">停止向 B 发送新请求，控制配置传播。</text><text x="42" y="609" font-size="23" fill="#172c43" font-weight="400">B 中已有请求并不会自动消失。</text><path d="M320 649 L320 675" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="688" width="592" height="144" rx="10" fill="#ffe2e0"/><text x="42" y="725" font-size="25" fill="#172c43" font-weight="600">④ 排空或按协议处理在途请求</text><text x="42" y="767" font-size="23" fill="#172c43" font-weight="400">已产生的副作用不能靠改路由撤销。</text><text x="42" y="801" font-size="23" fill="#172c43" font-weight="400">截止时间、幂等与补偿分别处理。</text></g></svg>
