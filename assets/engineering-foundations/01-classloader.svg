<svg xmlns="http://www.w3.org/2000/svg" width="640" height="864" viewBox="0 0 640 864" role="img" aria-labelledby="title desc"><title id="title">01 路由删了，引用可能还在</title><desc id="desc">开始：版本 A 正在服务: 路由表 → 旧对象 A → 类 A / LoaderA；长寿命线程 T → ThreadLocal → 旧对象 A。切换：路由改成版本 B: 路由表 → 新对象 B；旧对象 A 不再接收新路由请求。。但线程 T 还活着: T → ThreadLocal → A 的路径仍在。；因此 LoaderA 相关对象可能仍然可达。。清理与验证: 停止旧任务、解除注册、清理线程关联。；检查外部可达路径，再观察实际回收。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="864" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">01 路由删了，引用可能还在</text><text x="24" y="86" font-size="23" fill="#172c43" font-weight="400">只删一条路径，不等于旧对象已经不可达。</text><rect x="24" y="112" width="592" height="144" rx="10" fill="#e2eefb"/><text x="42" y="149" font-size="25" fill="#172c43" font-weight="600">开始：版本 A 正在服务</text><text x="42" y="191" font-size="23" fill="#172c43" font-weight="400">路由表 → 旧对象 A → 类 A / LoaderA</text><text x="42" y="225" font-size="23" fill="#172c43" font-weight="400">长寿命线程 T → ThreadLocal → 旧对象 A</text><path d="M320 265 L320 291" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="304" width="592" height="144" rx="10" fill="#dcf2e6"/><text x="42" y="341" font-size="25" fill="#172c43" font-weight="600">切换：路由改成版本 B</text><text x="42" y="383" font-size="23" fill="#172c43" font-weight="400">路由表 → 新对象 B</text><text x="42" y="417" font-size="23" fill="#172c43" font-weight="400">旧对象 A 不再接收新路由请求。</text><path d="M320 457 L320 483" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="496" width="592" height="144" rx="10" fill="#fff0db"/><text x="42" y="533" font-size="25" fill="#172c43" font-weight="600">但线程 T 还活着</text><text x="42" y="575" font-size="23" fill="#172c43" font-weight="400">T → ThreadLocal → A 的路径仍在。</text><text x="42" y="609" font-size="23" fill="#172c43" font-weight="400">因此 LoaderA 相关对象可能仍然可达。</text><path d="M320 649 L320 675" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="688" width="592" height="144" rx="10" fill="#dcf2e6"/><text x="42" y="725" font-size="25" fill="#172c43" font-weight="600">清理与验证</text><text x="42" y="767" font-size="23" fill="#172c43" font-weight="400">停止旧任务、解除注册、清理线程关联。</text><text x="42" y="801" font-size="23" fill="#172c43" font-weight="400">检查外部可达路径，再观察实际回收。</text></g></svg>
