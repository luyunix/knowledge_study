<svg xmlns="http://www.w3.org/2000/svg" width="640" height="796" viewBox="0 0 640 796" role="img" aria-labelledby="title desc"><title id="title">02 LRU：读取也会改变顺序</title><desc id="desc">① put(A,1): 顺序：[A]；Map：A → 节点 A。② put(B,2): 顺序：[B, A]；容量刚好为 2。。③ get(A) → 返回 1: 摘下 A，再放到头部：顺序 [A, B]。；get 并非纯读取，它修改了链表。。④ put(C,3): 先成 [C, A, B]，超容量，淘汰尾部 B。；最终 [C, A]；Map 也必须删除 B。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#425a70"/></marker></defs><rect width="640" height="796" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="44" font-size="28" fill="#172c43" font-weight="600">02 LRU：读取也会改变顺序</text><text x="24" y="86" font-size="23" fill="#172c43" font-weight="400">容量 2；左边最近使用，右边最久未用。</text><rect x="24" y="112" width="592" height="110" rx="10" fill="#e2eefb"/><text x="42" y="149" font-size="25" fill="#172c43" font-weight="600">① put(A,1)</text><text x="42" y="191" font-size="23" fill="#172c43" font-weight="400">顺序：[A]；Map：A → 节点 A</text><path d="M320 231 L320 257" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="270" width="592" height="110" rx="10" fill="#e2eefb"/><text x="42" y="307" font-size="25" fill="#172c43" font-weight="600">② put(B,2)</text><text x="42" y="349" font-size="23" fill="#172c43" font-weight="400">顺序：[B, A]；容量刚好为 2。</text><path d="M320 389 L320 415" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="428" width="592" height="144" rx="10" fill="#fff0db"/><text x="42" y="465" font-size="25" fill="#172c43" font-weight="600">③ get(A) → 返回 1</text><text x="42" y="507" font-size="23" fill="#172c43" font-weight="400">摘下 A，再放到头部：顺序 [A, B]。</text><text x="42" y="541" font-size="23" fill="#172c43" font-weight="400">get 并非纯读取，它修改了链表。</text><path d="M320 581 L320 607" stroke="#425a70" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="620" width="592" height="144" rx="10" fill="#dcf2e6"/><text x="42" y="657" font-size="25" fill="#172c43" font-weight="600">④ put(C,3)</text><text x="42" y="699" font-size="23" fill="#172c43" font-weight="400">先成 [C, A, B]，超容量，淘汰尾部 B。</text><text x="42" y="733" font-size="23" fill="#172c43" font-weight="400">最终 [C, A]；Map 也必须删除 B。</text></g></svg>
